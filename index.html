<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<title>開運解鎖一番賞｜展位問卷</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
  :root{
    --y:#FFE600; --k:#0b0b0b; --k2:#1a1a1a; --w:#ffffff; --g:#5a5a5a; --line:#e3e3e3; --err:#c62828;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; min-height:100vh; color:var(--k);
    font-family:'Noto Sans TC',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
    background-color:#141414;
    background-image:repeating-conic-gradient(#1f1f1f 0 25%, #141414 0 50%);
    background-size:72px 72px;
  }
  .wrap{max-width:560px; margin:0 auto; padding:0 16px 48px}

  /* HERO */
  .hero{background:var(--k); text-align:center; padding:22px 16px 18px; border-bottom:6px solid var(--y)}
  .hero .en{font-family:Anton,sans-serif; color:var(--y); font-size:clamp(34px,11vw,58px); line-height:1; letter-spacing:-.5px}
  .hero .zh{color:var(--w); font-weight:900; font-size:clamp(30px,9.5vw,50px); line-height:1.15; letter-spacing:2px; margin-top:4px}
  .hero .sub{display:inline-block; margin-top:12px; background:var(--y); color:var(--k); font-weight:900; font-size:14px; padding:6px 14px; border-radius:999px; letter-spacing:1px}

  /* STEPS INDICATOR */
  .steps{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; margin:18px 0 6px}
  .steps .s{position:relative; background:#2b2b2b; color:#bdbdbd; font-weight:700; font-size:13px; padding:10px 8px 10px 12px; line-height:1.25;
    clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%)}
  .steps .s b{display:block; font-family:Anton,sans-serif; font-weight:400; font-size:15px; letter-spacing:.5px}
  .steps .s.on{background:var(--y); color:var(--k)}
  .steps .s.ok{background:#3d3a12; color:var(--y)}
  .bar{height:6px; background:#2b2b2b; border-radius:99px; overflow:hidden; margin-bottom:16px}
  .bar i{display:block; height:100%; width:0; background:var(--y); transition:width .3s}

  /* CARDS */
  .card{background:var(--w); border-radius:var(--radius); padding:20px 18px; margin-bottom:14px}
  .section-title{display:flex; align-items:center; gap:10px; color:var(--y); font-weight:900; font-size:20px; margin:4px 0 12px}
  .section-title::before{content:""; width:10px; height:24px; background:var(--y); border-radius:2px}
  .intro p{margin:0 0 12px; line-height:1.75; font-size:16px; color:#222}
  .intro h1{font-size:20px; line-height:1.4; margin:0 0 12px; font-weight:900}
  .intro em{font-style:normal; font-weight:900; background:linear-gradient(transparent 60%, var(--y) 60%)}
  .how{list-style:none; padding:0; margin:16px 0 4px; display:grid; gap:8px}
  .how li{display:flex; align-items:center; gap:12px; background:#f6f6f6; border-radius:10px; padding:10px 12px; font-weight:700; font-size:15px}
  .how .n{flex:none; width:34px; height:34px; display:grid; place-items:center; background:var(--y); border-radius:8px; font-family:Anton,sans-serif; font-size:20px}

  fieldset.q{border:0; margin:0 0 14px; padding:20px 18px; background:var(--w); border-radius:var(--radius); outline:3px solid transparent; transition:outline-color .2s}
  fieldset.q.invalid{outline-color:var(--err)}
  legend{float:left; width:100%; padding:0; margin:0 0 14px; font-size:17px; font-weight:700; line-height:1.5}
  legend + *{clear:both}
  .qno{display:inline-grid; place-items:center; min-width:28px; height:28px; padding:0 6px; margin-right:8px; background:var(--k); color:var(--y); border-radius:6px; font-family:Anton,sans-serif; font-size:15px; font-weight:400; vertical-align:2px}
  .req{color:var(--err); margin-left:2px}
  .tag{display:inline-block; margin-left:8px; font-size:12px; font-weight:700; color:var(--g); background:#efefef; border-radius:4px; padding:1px 6px; vertical-align:2px}
  .err{color:var(--err); font-size:14px; font-weight:700; margin:10px 0 0}

  .opts{display:grid; gap:8px}
  .opt{display:flex; align-items:center; gap:12px; min-height:50px; padding:12px 14px; border:2px solid var(--line); border-radius:10px; cursor:pointer; font-size:16px; line-height:1.4; background:#fff; transition:border-color .15s, background .15s}
  .opt input{appearance:none; -webkit-appearance:none; flex:none; width:22px; height:22px; margin:0; border:2px solid #9a9a9a; border-radius:50%; display:grid; place-items:center; background:#fff}
  .opt input[type=checkbox]{border-radius:5px}
  .opt input:checked{border-color:var(--k); background:var(--k)}
  .opt input:checked::after{content:""; width:8px; height:8px; border-radius:50%; background:var(--y)}
  .opt input[type=checkbox]:checked::after{width:10px; height:6px; border-radius:0; background:none; border-left:3px solid var(--y); border-bottom:3px solid var(--y); transform:rotate(-45deg) translate(1px,-1px)}
  .opt:has(input:checked){border-color:var(--k); background:#fffbd1}
  .opt input:focus-visible{outline:3px solid #1565c0; outline-offset:2px}

  .scale{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px}
  .scale label{position:relative}
  .scale input{position:absolute; opacity:0; inset:0; margin:0; cursor:pointer}
  .scale span{display:grid; place-items:center; height:50px; border:2px solid var(--line); border-radius:10px; font-family:Anton,sans-serif; font-size:20px; background:#fff}
  .scale input:checked + span{background:var(--k); color:var(--y); border-color:var(--k)}
  .scale input:focus-visible + span{outline:3px solid #1565c0; outline-offset:2px}
  .scale-ends{display:flex; justify-content:space-between; font-size:13px; color:var(--g); margin-top:8px; font-weight:700}

  .mrow{padding:12px 0; border-top:1px solid var(--line)}
  .mrow:first-of-type{border-top:0; padding-top:0}
  .mlabel{font-family:Anton,sans-serif; font-size:20px; margin-bottom:8px}
  .seg{display:grid; gap:6px}
  .seg.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .seg.c4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .seg label{position:relative}
  .seg input{position:absolute; opacity:0; inset:0; margin:0; cursor:pointer}
  .seg span{display:grid; place-items:center; min-height:46px; padding:6px; text-align:center; border:2px solid var(--line); border-radius:10px; font-size:15px; font-weight:700; background:#fff}
  .seg input:checked + span{background:var(--k); color:var(--y); border-color:var(--k)}
  .seg input:focus-visible + span{outline:3px solid #1565c0; outline-offset:2px}

  /* FOLLOW */
  .follow .brand{font-family:Anton,sans-serif; font-size:clamp(30px,9vw,40px); line-height:1.05; margin:2px 0 10px}
  .follow p{margin:0 0 16px; color:#333; line-height:1.7; font-size:15px}
  .btn-follow{display:flex; align-items:center; justify-content:center; gap:10px; width:100%; min-height:58px; padding:12px 16px; background:#1877F2; color:#fff; text-decoration:none; font-weight:900; font-size:17px; border-radius:12px}
  .btn-follow:active{transform:translateY(1px)}
  .btn-follow:focus-visible{outline:3px solid var(--k); outline-offset:3px}
  .confirm{margin-top:14px}
  .confirm.locked{opacity:.45}
  .locked-hint{font-size:13px; color:var(--g); margin:8px 0 0; font-weight:700}

  /* NAV */
  .nav{display:flex; gap:10px; margin-top:6px}
  .btn{appearance:none; border:0; cursor:pointer; font:inherit; font-weight:900; font-size:17px; min-height:56px; border-radius:12px; padding:0 18px}
  .btn.primary{flex:1; background:var(--y); color:var(--k); clip-path:polygon(0 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,0 100%)}
  .btn.ghost{background:#2b2b2b; color:#eee}
  .btn:disabled{opacity:.6; cursor:wait}
  .btn:focus-visible{outline:3px solid #fff; outline-offset:2px}
  .form-err{background:#fde7e7; color:var(--err); font-weight:700; border-radius:10px; padding:12px 14px; margin:0 0 12px; font-size:15px}

  /* DONE */
  .done{text-align:center; padding-top:8px}
  .done .check{width:76px; height:76px; margin:6px auto 10px; border-radius:50%; background:var(--y); display:grid; place-items:center}
  .done h2{color:var(--y); font-size:34px; font-weight:900; margin:0 0 6px; letter-spacing:2px}
  .done .lead{color:#fff; font-size:17px; font-weight:700; margin:0 0 18px}
  .ticket{background:var(--w); border-radius:14px; padding:22px 18px; position:relative;
    -webkit-mask:radial-gradient(circle 14px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat, radial-gradient(circle 14px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat;
            mask:radial-gradient(circle 14px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat, radial-gradient(circle 14px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat}
  .t-label{font-size:14px; font-weight:700; color:var(--g); letter-spacing:2px}
  .t-num{font-family:Anton,sans-serif; font-size:72px; line-height:1.05; margin:2px 0 6px}
  .t-div{border-top:3px dashed #cfcfcf; margin:14px 6px}
  .t-code{font-size:34px; font-weight:900; letter-spacing:4px; background:var(--y); display:inline-block; padding:4px 16px; border-radius:8px; margin-top:6px}
  .small{color:#cfcfcf; font-size:13px; line-height:1.7; margin:12px 0 0}
  .foot{color:#9a9a9a; text-align:center; font-size:12px; margin-top:24px}
  @media (min-width:420px){ .seg.c4{grid-template-columns:repeat(4,minmax(0,1fr))} .scale{grid-template-columns:repeat(10,minmax(0,1fr))} .scale span{height:46px; font-size:18px} }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important; scroll-behavior:auto!important} }
</style>
</head>
<body>
<header class="hero">
  <div class="en">UNLOCK YOUR LUCK</div>
  <div class="zh">開運解鎖一番賞</div>
  <div class="sub">12/12 台北建材展　現場限定</div>
</header>

<div class="wrap">
  <nav class="steps" id="steps" aria-label="參加步驟"></nav>
  <div class="bar" aria-hidden="true"><i id="bar"></i></div>
  <main id="app" aria-live="polite"></main>
  <p class="foot">Yale Home Taiwan × Kwikset Taiwan</p>
</div>

<script>
(function () {
  'use strict';

  /* ===================== 設定區：只需要改這裡 ===================== */
  var CONFIG = {
    // 部署 Google Apps Script 後取得的「網頁應用程式網址」（結尾是 /exec）
    SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbwLFPTcE2Y_FC_ue3iCky5-IwPI3LCOXvP4HjGGNAAaQukoQz25NdB5MUnEEk1_bawd/exec',
    // 兩個粉專的網址
    YALE_URL: 'https://www.facebook.com/YaleHomeTaiwan',
    KWIKSET_URL: 'https://www.facebook.com/profile.php?id=61559880304985',
    // 完成頁顯示的今日通關碼
    PASSCODE: '開運1212',
    // 換一個名字＝讓所有手機重新開始（正式上線前改一次即可）
    STORAGE_KEY: 'luck1212_v2'
  };
  /* =============================================================== */

  var PAGES = [
    { type: 'intro', step: 1 },
    { step: 1, title: '第一部分：基本資料', qs: [
      { id: 'identity', no: 2, type: 'single', text: '您的身分別',
        options: ['建築師／設計師', '建商／承包商', '經銷商／零售商', '消費者'] }
    ]},
    { step: 1, title: '第二部分：展位體驗', qs: [
      { id: 'reason', no: 3, type: 'multi', text: '您是因什麼原因停留參觀本展位？',
        options: ['對於產品有興趣', '被一番賞活動吸引', '展位設計或產品展示吸引目光', '現場工作人員介紹', '正在尋找相關產品'] },
      { id: 'satisfaction', no: 4, type: 'scale', text: '您對本次展位整體設計滿意度？', min: 1, max: 10 },
      { id: 'product', no: 5, type: 'single', text: '最吸引您的產品為？',
        options: ['Yale電子鎖', 'Kwikset電子鎖／機械鎖', 'EZSET機械鎖', 'ASSA ABLOY相關產品'] }
    ]},
    { step: 1, title: '第三部分：品牌認知', qs: [
      { id: 'before', no: 6, type: 'matrix', text: '參展前，您對以下品牌的認識？',
        rows: ['Yale', 'Kwikset'], cols: ['沒聽過', '聽過'] },
      { id: 'after', no: 7, type: 'matrix', text: '參展後，您對以下品牌的認識？',
        rows: ['Yale', 'Kwikset'], cols: ['變差', '沒有改變', '稍微變好', '明顯變好'] }
    ]},
    { step: 1, title: '第四部分：社群媒體認知', qs: [
      { id: 'source', no: 8, type: 'single', text: '您是如何得知我們這次參展的資訊？',
        options: ['社群媒體（FB／IG）', '網路新聞', '雜誌', '展覽現場隨機參觀', '業務邀請', '朋友推薦'] },
      { id: 'content', no: 9, type: 'single', text: '您在社群媒體上最想看到的內容是？',
        options: ['新產品資訊', '使用教學或安裝示範', '實際案例或客戶故事', '折扣與活動消息', '品牌故事與幕後花絮'] }
    ]},
    { step: 1, title: '第五部分：總體意見', qs: [
      { id: 'revisit', no: 10, type: 'single', text: '您未來是否願意再次參觀我們的展覽或活動？',
        options: ['會', '可能會', '不確定', '不會'] }
    ]},
    { type: 'follow', step: 2, key: 'followYale', brand: 'Yale Home Taiwan', url: CONFIG.YALE_URL },
    { type: 'follow', step: 3, key: 'followKwikset', brand: 'Kwikset Taiwan', url: CONFIG.KWIKSET_URL, last: true }
  ];

  var STEP_NAMES = ['填寫問卷', '追蹤 Yale', '追蹤 Kwikset'];

  /* ---------- 儲存（關掉頁面或跳去 FB 再回來，填過的不會消失） ---------- */
  function load() {
    try { return JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEY)) || {}; } catch (e) { return {}; }
  }
  function save() {
    try { localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }
  if (/[?&]reset\b/.test(location.search)) {
    try { localStorage.removeItem(CONFIG.STORAGE_KEY); } catch (e) {}
    history.replaceState(null, '', location.pathname);
  }

  var state = Object.assign({ page: 0, answers: {}, clicked: {}, deviceId: '', done: null }, load());
  if (!state.deviceId) {
    state.deviceId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
      : Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  }
  if (state.page >= PAGES.length) state.page = 0;
  save();

  var app = document.getElementById('app');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function findQ(id) {
    for (var i = 0; i < PAGES.length; i++) {
      var qs = PAGES[i].qs || [];
      for (var j = 0; j < qs.length; j++) if (qs[j].id === id) return qs[j];
    }
    return null;
  }

  /* ---------- 進度 ---------- */
  function renderProgress() {
    var cur = state.done ? 4 : PAGES[state.page].step;
    var html = '';
    for (var i = 0; i < 3; i++) {
      var n = i + 1;
      var cls = n < cur ? 'ok' : (n === cur ? 'on' : '');
      html += '<div class="s ' + cls + '"' + (n === cur ? ' aria-current="step"' : '') + '><b>STEP ' + n + '</b>' + STEP_NAMES[i] + '</div>';
    }
    document.getElementById('steps').innerHTML = html;
    var pct = state.done ? 100 : Math.round(state.page / PAGES.length * 100);
    document.getElementById('bar').style.width = pct + '%';
  }

  /* ---------- 各類頁面 ---------- */
  function renderIntro() {
    app.innerHTML =
      '<section class="card intro">' +
        '<h1>感謝您蒞臨 2026 台北國際建築建材暨產品展！</h1>' +
        '<p>為了讓我們未來的展出有更好的體驗與表現，誠摯邀請您花 2–3 分鐘協助填寫這份問卷。本次調查將主要了解您對我們<em>展位體驗</em>的感受，以及<em>品牌知名度</em>的印象與認知。</p>' +
        '<p>您的回饋對我們非常重要，將有助於打造更吸睛、更貼近需求的展出內容。感謝您的參與，也期待下次能帶給您更棒的展覽體驗！</p>' +
        '<ul class="how">' +
          '<li><span class="n">1</span>填寫展位問卷</li>' +
          '<li><span class="n">2</span>追蹤 Yale Home Taiwan 粉專</li>' +
          '<li><span class="n">3</span>追蹤 Kwikset Taiwan 粉專</li>' +
        '</ul>' +
        '<p style="margin-top:14px;font-weight:900">完成以上 3 步驟，即可獲得一番賞抽獎資格！</p>' +
      '</section>' +
      '<div class="nav"><button type="button" class="btn primary" data-act="next">開始填寫</button></div>';
  }

  function qBody(q) {
    var a = state.answers[q.id];
    var html = '';
    if (q.type === 'single' || q.type === 'multi') {
      var t = q.type === 'single' ? 'radio' : 'checkbox';
      html += '<div class="opts">';
      q.options.forEach(function (o) {
        var on = q.type === 'single' ? a === o : (Array.isArray(a) && a.indexOf(o) > -1);
        html += '<label class="opt"><input type="' + t + '" name="' + q.id + '" value="' + esc(o) + '"' + (on ? ' checked' : '') + '><span>' + esc(o) + '</span></label>';
      });
      html += '</div>';
    } else if (q.type === 'scale') {
      html += '<div class="scale">';
      for (var n = q.min; n <= q.max; n++) {
        html += '<label><input type="radio" name="' + q.id + '" value="' + n + '"' + (a === n ? ' checked' : '') + ' aria-label="' + n + ' 分"><span>' + n + '</span></label>';
      }
      html += '</div><div class="scale-ends"><span>1　非常不滿意</span><span>非常滿意　10</span></div>';
    } else if (q.type === 'matrix') {
      var cls = q.cols.length <= 2 ? 'c2' : 'c4';
      q.rows.forEach(function (r) {
        var cur = a && a[r];
        html += '<div class="mrow" role="radiogroup" aria-label="' + esc(r) + '"><div class="mlabel">' + esc(r) + '</div><div class="seg ' + cls + '">';
        q.cols.forEach(function (c) {
          html += '<label><input type="radio" name="' + q.id + '__' + esc(r) + '" value="' + esc(c) + '"' + (cur === c ? ' checked' : '') + '><span>' + esc(c) + '</span></label>';
        });
        html += '</div></div>';
      });
    }
    return html;
  }

  function navHtml(last) {
    return '<div id="formErr"></div><div class="nav">' +
      '<button type="button" class="btn ghost" data-act="prev">上一頁</button>' +
      (last ? '<button type="button" class="btn primary" data-act="submit">送出，解鎖抽獎資格！</button>'
            : '<button type="button" class="btn primary" data-act="next">下一頁</button>') +
      '</div>';
  }

  function renderQuestions(p) {
    var html = '<div class="section-title">' + esc(p.title) + '</div>';
    p.qs.forEach(function (q) {
      html += '<fieldset class="q" id="q-' + q.id + '"><legend><span class="qno">' + q.no + '</span>' + esc(q.text) +
        '<span class="req" aria-label="必填">*</span>' + (q.type === 'multi' ? '<span class="tag">可複選</span>' : '') + '</legend>' +
        qBody(q) + '<p class="err" hidden>此題為必填</p></fieldset>';
    });
    app.innerHTML = html + navHtml(false);
  }

  var ARROW = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>';

  function renderFollow(p) {
    var clicked = !!state.clicked[p.key];
    var checked = !!state.answers[p.key];
    app.innerHTML =
      '<div class="section-title">STEP ' + p.step + '｜追蹤粉絲專頁</div>' +
      '<fieldset class="q follow" id="q-' + p.key + '">' +
        '<legend class="sr">追蹤 ' + esc(p.brand) + '</legend>' +
        '<div class="brand">' + esc(p.brand) + '</div>' +
        '<p>點下方按鈕前往粉專，按下「追蹤」後，<b>請回到這個頁面</b>' + (p.last ? '按送出。' : '繼續下一步。') + '</p>' +
        '<a class="btn-follow" href="' + esc(p.url) + '" target="_blank" rel="noopener" data-follow-link="' + p.key + '">前往 ' + esc(p.brand) + ' 粉專' + ARROW + '</a>' +
        '<label class="opt confirm' + (clicked ? '' : ' locked') + '"><input type="checkbox" data-follow="' + p.key + '"' + (checked ? ' checked' : '') + (clicked ? '' : ' disabled') + '><span>我已追蹤 ' + esc(p.brand) + ' 粉專</span></label>' +
        (clicked ? '' : '<p class="locked-hint">請先點上方按鈕前往粉專</p>') +
        '<p class="err" hidden>請先追蹤粉專，再勾選上方確認</p>' +
      '</fieldset>' + navHtml(!!p.last);
  }

  function renderDone() {
    var d = state.done;
    var num = String(d.serial).padStart(3, '0');
    app.innerHTML =
      '<section class="done">' +
        '<div class="check"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#0b0b0b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 10 17 19 7"/></svg></div>' +
        '<h2>解鎖成功！</h2>' +
        '<p class="lead">請出示此畫面給現場工作人員</p>' +
        '<div class="ticket">' +
          '<div class="t-label">抽獎編號</div>' +
          '<div class="t-num">No.' + esc(num) + '</div>' +
          '<div class="t-div"></div>' +
          '<div class="t-label">今日通關碼</div>' +
          '<div class="t-code">' + esc(CONFIG.PASSCODE) + '</div>' +
        '</div>' +
        '<p class="small">完成時間：' + esc(d.time) + '<br>兌換前請勿清除瀏覽紀錄；重新打開本頁也會顯示此畫面。</p>' +
      '</section>';
  }

  function render() {
    renderProgress();
    if (state.done) { renderDone(); }
    else {
      var p = PAGES[state.page];
      if (p.type === 'intro') renderIntro();
      else if (p.type === 'follow') renderFollow(p);
      else renderQuestions(p);
    }
    window.scrollTo(0, 0);
  }

  /* ---------- 驗證 ---------- */
  function setInvalid(id, bad) {
    var fs = document.getElementById('q-' + id);
    if (!fs) return;
    fs.classList.toggle('invalid', bad);
    fs.querySelector('.err').hidden = !bad;
  }
  function validate(p) {
    var first = null;
    if (p.type === 'follow') {
      var ok = !!state.answers[p.key];
      setInvalid(p.key, !ok);
      if (!ok) first = document.getElementById('q-' + p.key);
    }
    (p.qs || []).forEach(function (q) {
      var v = state.answers[q.id], good;
      if (q.type === 'multi') good = Array.isArray(v) && v.length > 0;
      else if (q.type === 'matrix') good = !!v && q.rows.every(function (r) { return !!v[r]; });
      else good = v !== undefined && v !== null && v !== '';
      setInvalid(q.id, !good);
      if (!good && !first) first = document.getElementById('q-' + q.id);
    });
    if (first) { first.scrollIntoView({ behavior: 'smooth', block: 'center' }); return false; }
    return true;
  }

  function showFormErr(msg) {
    var box = document.getElementById('formErr');
    if (box) box.innerHTML = msg ? '<p class="form-err" role="alert">' + esc(msg) + '</p>' : '';
  }

  /* ---------- 送出 ---------- */
  var sending = false;
  function submit(btn) {
    var p = PAGES[state.page];
    if (!validate(p) || sending) return;
    if (!/^https:\/\//.test(CONFIG.SCRIPT_URL)) { showFormErr('尚未設定 SCRIPT_URL，請看教學第 2 步。'); return; }
    sending = true;
    btn.disabled = true; btn.textContent = '送出中…';
    showFormErr('');
    fetch(CONFIG.SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ deviceId: state.deviceId, answers: state.answers, ua: navigator.userAgent })
    })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (!data || !data.ok) throw new Error((data && data.error) || 'error');
      state.done = {
        serial: data.serial,
        time: new Date().toLocaleString('zh-TW', { hour12: false })
      };
      save(); render();
    })
    .catch(function (err) {
      sending = false;
      btn.disabled = false; btn.textContent = '送出，解鎖抽獎資格！';
      showFormErr(err && err.message === 'closed'
        ? '本活動問卷已截止，感謝您的參與！'
        : '送出失敗，請確認網路連線後再按一次。');
    });
  }

  /* ---------- 事件 ---------- */
  app.addEventListener('change', function (e) {
    var t = e.target;
    if (t.dataset.follow) {
      state.answers[t.dataset.follow] = t.checked;
      if (t.checked) setInvalid(t.dataset.follow, false);
      save(); return;
    }
    if (!t.name) return;
    var parts = t.name.split('__');
    var q = findQ(parts[0]);
    if (!q) return;
    if (q.type === 'multi') {
      state.answers[q.id] = Array.prototype.map.call(
        app.querySelectorAll('input[name="' + q.id + '"]:checked'), function (x) { return x.value; });
    } else if (q.type === 'matrix') {
      var m = Object.assign({}, state.answers[q.id]); m[parts[1]] = t.value; state.answers[q.id] = m;
    } else if (q.type === 'scale') {
      state.answers[q.id] = Number(t.value);
    } else {
      state.answers[q.id] = t.value;
    }
    var fs = document.getElementById('q-' + q.id);
    if (fs && fs.classList.contains('invalid')) validate({ qs: [q] });
    save();
  });

  app.addEventListener('click', function (e) {
    var link = e.target.closest('[data-follow-link]');
    if (link) {
      var key = link.dataset.followLink;
      state.clicked[key] = true; save();
      var cb = app.querySelector('input[data-follow="' + key + '"]');
      if (cb) { cb.disabled = false; cb.closest('.opt').classList.remove('locked'); }
      var hint = app.querySelector('.locked-hint'); if (hint) hint.remove();
      return; // 讓連結照常開啟
    }
    var btn = e.target.closest('[data-act]');
    if (!btn) return;
    var act = btn.dataset.act, p = PAGES[state.page];
    if (act === 'prev' && state.page > 0) { state.page--; save(); render(); }
    else if (act === 'next') { if (p.type === 'intro' || validate(p)) { state.page++; save(); render(); } }
    else if (act === 'submit') { submit(btn); }
  });

  // 從 FB 切回來時，同步勾選狀態
  window.addEventListener('pageshow', function () { if (!state.done) renderProgress(); });

  render();
})();
</script>
<style>.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}</style>
</body>
</html>
